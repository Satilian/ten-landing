name: Publish and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      KUBECONFIG: ${{ runner.temp }}/kubeconfig
      NAMESPACE: ${{ vars.K8S_NAMESPACE || 'ten-master' }}
      INGRESS_CLASS: ${{ vars.INGRESS_CLASS }}
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      TLS_SECRET: ${{ vars.TLS_SECRET || 'ten-master-tls' }}
      PULL_SECRET: ${{ vars.IMAGE_PULL_SECRET }}
      TLS_ISSUER: ${{ vars.TLS_CLUSTER_ISSUER }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Configure cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64" || { echo 'KUBE_CONFIG_B64 is required'; exit 1; }
          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
      - name: Deploy website
        run: |
          set -euo pipefail
          options=()
          if [ -n "$PULL_SECRET" ]; then
            options+=(--set-string "imagePullSecrets[0].name=$PULL_SECRET")
          fi
          if [ -n "$TLS_ISSUER" ]; then
            options+=(--set-string "ingress.annotations.cert-manager\.io/cluster-issuer=$TLS_ISSUER")
          fi
          helm lint helm/ten-master --strict --set-string "image.repository=$IMAGE" --set-string "image.digest=$DIGEST"
          helm upgrade --install ten-master helm/ten-master \
            --namespace "$NAMESPACE" --create-namespace \
            --set-string "image.repository=$IMAGE" \
            --set-string "image.digest=$DIGEST" \
            --set-string "ingress.className=$INGRESS_CLASS" \
            --set-string "ingress.tls.secretName=$TLS_SECRET" \
            "${options[@]}" --atomic --wait --timeout 5m --history-max 5
      - name: Remove cluster credentials
        if: always()
        run: rm -f "$KUBECONFIG"
